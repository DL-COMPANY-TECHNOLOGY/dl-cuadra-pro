<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2e"/><stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22e4ff"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="chk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#22e4ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx=".5" cy=".45" r=".55">
      <stop offset="0" stop-color="#22e4ff" stop-opacity=".18"/><stop offset="1" stop-color="#22e4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <circle cx="256" cy="256" r="210" fill="url(#halo)"/>
  <!-- rejilla tech -->
  <g stroke="#22e4ff" stroke-opacity=".07" stroke-width="2">
    <path d="M96 0v512M176 0v512M256 0v512M336 0v512M416 0v512M0 96h512M0 176h512M0 256h512M0 336h512M0 416h512"/>
  </g>
  <!-- C futurista: arco abierto con cortes -->
  <g filter="url(#glow)" fill="none" stroke="url(#neon)" stroke-linecap="round">
    <path d="M372 150 A150 150 0 1 0 372 362" stroke-width="34"/>
    <path d="M330 118 A182 182 0 0 0 112 168" stroke-width="8" stroke-opacity=".8"/>
    <path d="M112 344 A182 182 0 0 0 330 394" stroke-width="8" stroke-opacity=".8"/>
  </g>
  <!-- nodos de circuito -->
  <g fill="#22e4ff"><circle cx="330" cy="118" r="10"/><circle cx="330" cy="394" r="10"/><circle cx="112" cy="168" r="7"/><circle cx="112" cy="344" r="7"/></g>
  <!-- barras de ventas -->
  <g fill="url(#bar)">
    <rect x="186" y="262" width="34" height="70" rx="8"/>
    <rect x="234" y="226" width="34" height="106" rx="8"/>
    <rect x="282" y="190" width="34" height="142" rx="8" opacity=".95"/>
  </g>
  <!-- check de caja cuadrada -->
  <path d="M300 270 l34 34 l74 -86" fill="none" stroke="url(#chk)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
